<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e43">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173e43'/%3E%3Cellipse cx='32' cy='39' rx='24' ry='12' fill='%23faf3df'/%3E%3Cellipse cx='32' cy='29' rx='24' ry='13' fill='%23eb7e61'/%3E%3Cpath d='M25 17h14v34H25z' fill='%2335685c'/%3E%3C/svg%3E">
  <title>Sushi by the Sea</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #173e43; }
    body { font-family: system-ui, -apple-system, sans-serif; color: #173e43; }
    #unity-container { position: fixed; inset: 0; display: grid; place-items: center; }
    #unity-canvas { display: block; width: min(100vw, 160vh); height: min(100vh, 62.5vw); outline: none; background: #173e43; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; padding: 28px; text-align: center; background: #faf3df; }
    #loading[hidden] { display: none; }
    .mark { position: relative; width: 78px; height: 42px; margin: 0 auto 28px; border-radius: 50% 50% 42% 42%; background: #eb7e61; box-shadow: 0 12px 0 #fffdf6, 0 18px 0 #e1d9bf; transform: rotate(-8deg); }
    .mark::after { content: ""; position: absolute; width: 17px; inset: -1px auto -13px 30px; background: #35685c; }
    h1 { max-width: 560px; margin: 0 0 10px; font-size: clamp(30px, 5vw, 56px); line-height: 1.05; letter-spacing: -.04em; }
    p { margin: 8px 0 24px; color: #547171; }
    .track { width: min(320px, 75vw); height: 8px; overflow: hidden; border-radius: 8px; margin: 0 auto; background: #e2decc; }
    #progress { width: 0; height: 100%; border-radius: inherit; background: #dc7258; transition: width .16s; }
    #loading-status { margin: 16px 0 0; font-size: 13px; letter-spacing: .04em; }
    #warning { position: fixed; left: 20px; right: 20px; bottom: 20px; z-index: 4; padding: 18px; border-radius: 10px; color: #faf3df; background: #943f35; max-height: 40vh; overflow: auto; white-space: pre-wrap; }
    #warning[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="Sushi by the Sea game. Use WASD to move, Shift to dash, E to interact or hold to wash, arrow keys to cut fish, and Space to stop beer or fishing timing."></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div class="mark" aria-hidden="true"></div>
      <h1>Sushi by the Sea</h1>
      <p>A little restaurant. A big reputation.</p>
      <div class="track"><div id="progress"></div></div>
      <p id="loading-status">Preparing your seaside shift…</p>
    </div>
    <div id="warning" role="alert" hidden></div>
  </main>
  <script src="Web.loader.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const warning = document.getElementById('warning');
    function showBanner(message, type) {
      if (type !== 'error') { console.warn(message); return; }
      warning.textContent = message;
      warning.hidden = false;
    }
    const config = {
      arguments: [],
      dataUrl: "Web.data.unityweb",
      frameworkUrl: "Web.framework.js.unityweb",
      codeUrl: "Web.wasm.unityweb",
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Astra Studio",
      productName: "Sushi by the Sea",
      productVersion: "0.4.1",
      fullscreenElementID: 'unity-container',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      autoSyncPersistentDataPath: true,
      showBanner: showBanner
    };
    createUnityInstance(canvas, config, function (value) {
      const percent = Math.round(Math.max(0, Math.min(1, value)) * 100);
      document.getElementById('progress').style.width = percent + '%';
      document.getElementById('loading-status').textContent = percent < 100 ? 'Preparing your seaside shift… ' + percent + '%' : 'Welcoming the crew…';
    }).then(function (instance) {
      window.unityInstance = instance;
      loading.hidden = true;
      canvas.focus();
    }).catch(function (message) {
      showBanner('The restaurant could not open. Reload the page to try again.\n' + message, 'error');
    });
    canvas.addEventListener('pointerdown', function () { canvas.focus(); });
  </script>
</body>
</html>
